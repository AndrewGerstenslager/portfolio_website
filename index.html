<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Andrew Gerstenslager</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon/AG_Favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Departure+Mono&display=swap" rel="stylesheet">
    <script type="module" src="/src/main.js"></script>
</head>
<body class="bg-bg text-brand font-mono overflow-hidden w-screen h-[100dvh] flex flex-col select-none">

    <!-- Three.js canvas — fills entire viewport behind everything -->
    <canvas id="globe-canvas" class="fixed inset-0 w-full h-full z-0"></canvas>

    <!-- UI layer — sits on top of canvas -->
    <div id="ui-layer" class="relative z-10 w-full h-full flex items-center justify-center pointer-events-none">

        <!-- HUD wrapper: sized by JS, name + box + buttons all anchored here -->
        <div id="hud-wrapper" class="relative">

            <!-- ─── Name: anchored above the box ─── -->
            <header id="name-header" class="absolute bottom-full left-0 right-0 flex items-center justify-center gap-2 pb-1">
                <div class="name-lines flex gap-2 items-end" aria-hidden="true">
                    <span class="line" style="height:52px"></span>
                    <span class="line" style="height:41px"></span>
                    <span class="line" style="height:30px"></span>
                    <span class="line" style="height:19px"></span>
                    <span class="line" style="height:8px"></span>
                </div>
                <h1 class="text-3xl md:text-5xl tracking-widest opacity-90 whitespace-nowrap px-6">
                    ANDREW GERSTENSLAGER
                </h1>
                <div class="name-lines flex gap-2 items-end" aria-hidden="true">
                    <span class="line" style="height:8px"></span>
                    <span class="line" style="height:19px"></span>
                    <span class="line" style="height:30px"></span>
                    <span class="line" style="height:41px"></span>
                    <span class="line" style="height:52px"></span>
                </div>
            </header>

            <!-- ─── The box (HUD) ─── -->
            <div id="hud" class="relative">

                <!-- Decorative SVG frame -->
                <svg id="deco-frame" class="absolute inset-0 w-full h-full"
                     viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                    <rect x="50" y="50" width="900" height="900" fill="none" stroke="currentColor" stroke-width="5" opacity="0.4"/>
                    <rect x="60" y="60" width="880" height="880" fill="none" stroke="currentColor" stroke-width="1" opacity="0.25"/>
                    <circle cx="500" cy="500" r="280" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
                    <line x1="500" y1="220" x2="500" y2="195" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
                    <line x1="780" y1="500" x2="805" y2="500" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
                    <line x1="500" y1="780" x2="500" y2="805" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
                    <line x1="220" y1="500" x2="195" y2="500" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
                    <line x1="698" y1="302" x2="716" y2="284" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
                    <line x1="698" y1="698" x2="716" y2="716" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
                    <line x1="302" y1="698" x2="284" y2="716" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
                    <line x1="302" y1="302" x2="284" y2="284" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
                    <g opacity="0.35">
                        <polyline points="160,380 160,460 180,500 160,540 160,620" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <line x1="160" y1="380" x2="144" y2="364" stroke="currentColor" stroke-width="1.2"/>
                        <line x1="160" y1="620" x2="144" y2="636" stroke="currentColor" stroke-width="1.2"/>
                    </g>
                    <g opacity="0.35">
                        <polyline points="840,380 840,460 820,500 840,540 840,620" fill="none" stroke="currentColor" stroke-width="1.2"/>
                        <line x1="840" y1="380" x2="856" y2="364" stroke="currentColor" stroke-width="1.2"/>
                        <line x1="840" y1="620" x2="856" y2="636" stroke="currentColor" stroke-width="1.2"/>
                    </g>
                </svg>

                <!-- Zoom indicator -->
                <div id="zoom-indicator" class="indicator-panel" style="top:7%; left:7%">
                    <div class="indicator-bracket">
                        <span class="indicator-label">ZOOM</span>
                        <div class="indicator-bar-track">
                            <div id="zoom-bar-fill" class="indicator-bar-fill"></div>
                            <div id="zoom-slider-handle" class="indicator-slider-handle pointer-events-auto"
                                 role="slider" aria-label="Zoom level" aria-valuemin="0" aria-valuemax="100" tabindex="0"></div>
                        </div>
                    </div>
                </div>

                <!-- Velocity indicator -->
                <div id="velocity-indicator" class="indicator-panel" style="top:7%; right:7%">
                    <div class="indicator-bracket">
                        <span class="indicator-label">VELOCITY</span>
                        <div class="indicator-bar-track">
                            <div id="velocity-bar-fill" class="indicator-bar-fill"></div>
                        </div>
                        <span id="velocity-value" class="indicator-value">0.00</span>
                    </div>
                </div>

            </div><!-- /hud -->

            <!-- ─── Buttons: anchored below the box ─── -->
            <nav id="nav-buttons" class="absolute top-full left-0 right-0 flex flex-col md:flex-row items-stretch md:items-center justify-center gap-2 md:gap-5 pt-1 pointer-events-auto">
                <button id="about-btn" class="nav-btn">ABOUT ME</button>
                <button id="portfolio-btn" class="nav-btn">PORTFOLIO</button>
                <button id="demos-btn" class="nav-btn">DEMOS</button>
            </nav>

            <!-- Return button (hidden by default) -->
            <nav id="return-nav" class="absolute top-full left-0 right-0 hidden items-stretch md:items-center justify-center pt-1 pointer-events-auto">
                <button id="return-btn" class="nav-btn w-full md:w-auto">RETURN</button>
            </nav>

        </div><!-- /hud-wrapper -->

        <!-- Coming soon overlay (hidden by default) -->
        <div id="coming-soon" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none">
            <p class="text-3xl md:text-5xl font-bold tracking-widest opacity-90 text-center leading-relaxed">
                COMING<br>SOON!
            </p>
        </div>
    </div>

</body>
</html>
